[databases]
su_connect = host=127.0.0.1 port=5432 dbname=su_connect auth_user=postgres
* = host=127.0.0.1 port=5432 auth_user=postgres

[pgbouncer]
logfile = d:/FINAL-Project/pgbouncer/pgbouncer.log
pidfile = d:/FINAL-Project/pgbouncer/pgbouncer.pid

listen_addr = 127.0.0.1
listen_port = 6432

auth_type = scram-sha-256
auth_file = d:/FINAL-Project/pgbouncer/userlist.txt

admin_users = postgres
stats_users = postgres

# Pool Configuration
pool_mode = transaction
max_client_conn = 250
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 60

# Timeouts
server_idle_timeout = 600
client_idle_timeout = 0
server_connect_timeout = 15
server_lifetime = 3600
server_reset_query = DISCARD ALL

# Compatibility with psycopg2 and Django
ignore_startup_parameters = extra_float_digits
